<style>
:root{
  --space-950:#060a18;
  --space-900:#0a0f22;
  --space-850:#0d1430;
  --space-800:#121a3a;
  --space-700:#1a2350;
  --line:rgba(120,140,230,.16);
  --line-strong:rgba(140,165,255,.30);
  --panel:rgba(16,23,52,.62);
  --panel-solid:#0e1533;
  --ink:#e8ecff;
  --ink-dim:#aab2dd;
  --ink-faint:#6b75a8;
  --cyan:oklch(.80 .13 205);
  --violet:oklch(.72 .16 290);
  --magenta:oklch(.72 .19 330);
  --blue:oklch(.72 .15 255);
  --green:oklch(.80 .15 155);
  --amber:oklch(.82 .14 70);
  --red:oklch(.68 .19 18);
  --glow-cyan:oklch(.80 .13 205 / .45);
  --r-lg:18px; --r-md:13px; --r-sm:9px;
  --shadow:0 18px 48px -22px rgba(0,0,0,.85);
  --font-d:'Space Grotesk',system-ui,sans-serif;
  --font-b:'IBM Plex Sans',system-ui,sans-serif;
  --font-m:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{
  font-family:var(--font-b);
  background:var(--space-950);
  color:var(--ink);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;}
#stars{position:fixed;inset:0;z-index:0;}
.nebula{position:fixed;z-index:0;pointer-events:none;filter:blur(60px);opacity:.55;border-radius:50%;}
.neb1{width:55vw;height:55vw;left:-8vw;top:-14vw;
  background:radial-gradient(circle at 50% 50%,var(--magenta),transparent 62%);opacity:.32;}
.neb2{width:48vw;height:48vw;right:-10vw;top:8vh;
  background:radial-gradient(circle at 50% 50%,var(--blue),transparent 62%);opacity:.34;}
.neb3{width:60vw;height:60vw;left:18vw;bottom:-30vw;
  background:radial-gradient(circle at 50% 50%,var(--violet),transparent 64%);opacity:.26;}
#root{position:relative;z-index:1;height:100%;}

/* scrollbars */
*::-webkit-scrollbar{width:10px;height:10px;}
*::-webkit-scrollbar-thumb{background:rgba(120,140,230,.22);border-radius:20px;border:2px solid transparent;background-clip:padding-box;}
*::-webkit-scrollbar-thumb:hover{background:rgba(120,140,230,.4);background-clip:padding-box;}
*::-webkit-scrollbar-track{background:transparent;}

/* shared atoms used across component files */
.glass{background:var(--panel);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--line);}
.mono{font-family:var(--font-m);}
.disp{font-family:var(--font-d);}
button{font-family:inherit;cursor:pointer;color:inherit;}
input,select,textarea{font-family:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
.scrollY{overflow-y:auto;overflow-x:hidden;}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulseGlow{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes fadeUp{from{transform:translateY(10px)}to{transform:none}}
@keyframes popIn{from{transform:scale(.97)}to{transform:none}}
.fadeUp{animation:fadeUp .5s cubic-bezier(.2,.7,.2,1) both;}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;}
}

<div id="bg">
  <div class="nebula neb1"></div>

  <div class="nebula neb3"></div>
</div>
<canvas id="stars"></canvas>
<div id="root"></div>

<!-- animated starfield (plain JS, runs immediately) -->
<script>
(function(){
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  let w,h,dpr,stars=[],shoot=null,raf;
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  function resize(){
    dpr = Math.min(devicePixelRatio||1, 2);
    w = c.width = innerWidth*dpr; h = c.height = innerHeight*dpr;
    c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px';
    const count = Math.round((innerWidth*innerHeight)/5200);
    stars = Array.from({length:count},()=>({
      x:Math.random()*w, y:Math.random()*h,
      r:(Math.random()*1.3+.2)*dpr,
      a:Math.random()*.6+.2,
      tw:Math.random()*.02+.004,
      ph:Math.random()*Math.PI*2,
      hue:Math.random()<.18?(Math.random()<.5?330:205):null,
      dx:(Math.random()-.5)*.02*dpr, dy:(Math.random()*.04+.01)*dpr,
    }));
  }
  function maybeShoot(){
    if(reduce) return;
    if(!shoot && Math.random()<.004){
      shoot={x:Math.random()*w*.7,y:Math.random()*h*.4,
        vx:(Math.random()*4+5)*dpr,vy:(Math.random()*2+1.6)*dpr,life:1};
    }
  }
  function frame(){
    ctx.clearRect(0,0,w,h);
    for(const s of stars){
      s.ph+=s.tw; const a=s.a*(0.6+0.4*Math.sin(s.ph));
      s.x+=s.dx; s.y+=s.dy;
      if(s.y>h)s.y=0; if(s.x>w)s.x=0; if(s.x<0)s.x=w;
      ctx.beginPath();
      if(s.hue){ctx.fillStyle=`oklch(.82 .14 ${s.hue} / ${a})`;}
      else ctx.fillStyle=`rgba(225,232,255,${a})`;
      ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();
    }
    maybeShoot();
    if(shoot){
      const g=ctx.createLinearGradient(shoot.x,shoot.y,shoot.x-shoot.vx*7,shoot.y-shoot.vy*7);
      g.addColorStop(0,`rgba(180,220,255,${shoot.life})`);g.addColorStop(1,'rgba(180,220,255,0)');
      ctx.strokeStyle=g;ctx.lineWidth=1.6*dpr;ctx.beginPath();
      ctx.moveTo(shoot.x,shoot.y);ctx.lineTo(shoot.x-shoot.vx*7,shoot.y-shoot.vy*7);ctx.stroke();
      shoot.x+=shoot.vx;shoot.y+=shoot.vy;shoot.life-=.012;
      if(shoot.life<=0||shoot.x>w||shoot.y>h)shoot=null;
    }
    raf=requestAnimationFrame(frame);
  }
  addEventListener('resize',resize);resize();
  if(reduce){ // draw once
    for(const s of stars){ctx.beginPath();ctx.fillStyle=`rgba(225,232,255,${s.a})`;ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();}
  } else frame();
})();
</script>

<!-- Firebase backend + Mission Control LLM bridge -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
(function(){
  const NS='concrete-breaks';
  try{ if(!firebase.apps.length) firebase.initializeApp({databaseURL:'https://gen-lang-client-0119642855-default-rtdb.firebaseio.com'}); }
  catch(e){ console.error('Firebase init failed',e); }
  const db=firebase.database();
  // Namespaced realtime helpers used by App.jsx for the shared (multi-user) backend.
  window.fb={
    listen:(p,cb)=>db.ref(NS+'/'+p).on('value',s=>cb(s.val())),
    set:(p,d)=>db.ref(NS+'/'+p).set(d),
    update:(p,d)=>db.ref(NS+'/'+p).update(d),
    remove:(p)=>db.ref(NS+'/'+p).remove(),
    get:(p)=>db.ref(NS+'/'+p).once('value').then(s=>s.val()),
    inc:(p,by)=>db.ref(NS+'/'+p).transaction(v=>(v||0)+by), // atomic point increments
    rootGet:(p)=>db.ref(p).once('value').then(s=>s.val()),
    rootSet:(p,d)=>db.ref(p).set(d)
  };
  // Mission Control LLM — MiniMax (Anthropic-compatible), key shared at ROOT config/minimax_key (same as CUP).
  const MM_URL='https://api.minimax.io/anthropic/v1/messages', MM_MODEL='MiniMax-M2.7';
  let mmKey=null;
  async function getKey(){
    if(mmKey)return mmKey;
    mmKey=await window.fb.rootGet('config/minimax_key').catch(()=>null);
    if(!mmKey)mmKey=localStorage.getItem('cup_alfred_key')||localStorage.getItem('cb_minimax_key');
    if(!mmKey){mmKey=prompt('Enter MiniMax API key (saved for all apps):');if(mmKey){localStorage.setItem('cb_minimax_key',mmKey);window.fb.rootSet('config/minimax_key',mmKey).catch(()=>{});}}
    return mmKey;
  }
  window.claude={complete:async(prompt)=>{
    const key=await getKey(); if(!key) throw new Error('no MiniMax key');
    const r=await fetch(MM_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model:MM_MODEL,max_tokens:1024,messages:[{role:'user',content:prompt}]})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    return (j.content&&j.content.map(c=>c.text||'').join(''))||j.reply||'';
  }};
})();
</script>
