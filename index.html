<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script>
  /* Lite mode (no-GPU laptops): strips blur/backdrop-filter/loops. Applied to
     <html> before first paint to avoid a heavy flash. Auto-on for reduced-motion. */
  try {
    var pref = localStorage.getItem('orbital_lite');
    if (pref === '1' || (pref == null && matchMedia('(prefers-reduced-motion:reduce)').matches)) document.documentElement.classList.add('perf-lite');
  } catch (e) {}
</script>
<style>
:root{
  --space-950:#060a18;
  --space-900:#0a0f22;
  --space-850:#0d1430;
  --space-800:#121a3a;
  --space-700:#1a2350;
  --line:rgba(120,140,230,.16);
  --line-strong:rgba(140,165,255,.30);
  --panel:rgba(16,23,52,.62);
  --panel-solid:#0e1533;
  --ink:#e8ecff;
  --ink-dim:#aab2dd;
  --ink-faint:#6b75a8;
  --cyan:oklch(.80 .13 205);
  --violet:oklch(.72 .16 290);
  --magenta:oklch(.72 .19 330);
  --blue:oklch(.72 .15 255);
  --green:oklch(.80 .15 155);
  --amber:oklch(.82 .14 70);
  --red:oklch(.68 .19 18);
  --glow-cyan:oklch(.80 .13 205 / .45);
  --r-lg:18px; --r-md:13px; --r-sm:9px;
  --shadow:0 18px 48px -22px rgba(0,0,0,.85);
  --font-d:'Space Grotesk',system-ui,sans-serif;
  --font-b:'IBM Plex Sans',system-ui,sans-serif;
  --font-m:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{
  font-family:var(--font-b);
  background:var(--space-950);
  color:var(--ink);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;}
#stars{position:fixed;inset:0;z-index:0;}
.nebula{position:fixed;z-index:0;pointer-events:none;filter:blur(60px);opacity:.55;border-radius:50%;}
.neb1{width:55vw;height:55vw;left:-8vw;top:-14vw;
  background:radial-gradient(circle at 50% 50%,var(--magenta),transparent 62%);opacity:.32;}
.neb2{width:48vw;height:48vw;right:-10vw;top:8vh;
  background:radial-gradient(circle at 50% 50%,var(--blue),transparent 62%);opacity:.34;}
.neb3{width:60vw;height:60vw;left:18vw;bottom:-30vw;
  background:radial-gradient(circle at 50% 50%,var(--violet),transparent 64%);opacity:.26;}
#root{position:relative;z-index:1;height:100%;}

/* scrollbars */
*::-webkit-scrollbar{width:10px;height:10px;}
*::-webkit-scrollbar-thumb{background:rgba(120,140,230,.22);border-radius:20px;border:2px solid transparent;background-clip:padding-box;}
*::-webkit-scrollbar-thumb:hover{background:rgba(120,140,230,.4);background-clip:padding-box;}
*::-webkit-scrollbar-track{background:transparent;}

/* shared atoms used across component files */
.glass{background:var(--panel);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--line);}
.mono{font-family:var(--font-m);}
.disp{font-family:var(--font-d);}
button{font-family:inherit;cursor:pointer;color:inherit;}
input,select,textarea{font-family:inherit;color:inherit;}
/* remove the ugly native number spinner arrows everywhere */
input[type=number]{-moz-appearance:textfield;}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
.scrollY{overflow-y:auto;overflow-x:hidden;}
/* global buttons (also used outside EntryForm, e.g. the Dashboard/empty states) */
.btn-ghost{padding:11px 20px;border-radius:11px;background:rgba(16,23,52,.5);border:1px solid var(--line-strong);
  color:var(--ink-dim);font-size:13px;transition:.15s;}
.btn-ghost:hover{color:var(--ink);border-color:var(--cyan);}
.btn-ghost:disabled{opacity:.4;cursor:not-allowed;}
.btn-primary{display:inline-flex;align-items:center;gap:10px;padding:11px 22px;border-radius:11px;border:none;
  font-size:13px;font-weight:600;color:#06122a;background:linear-gradient(135deg,var(--cyan),var(--violet));
  box-shadow:0 0 26px -8px var(--glow-cyan);transition:transform .12s,box-shadow .2s;}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 0 34px -6px var(--glow-cyan);}
.btn-primary .mono{font-size:11px;opacity:.7;}
/* shared headings (used by several views) */
.ms-eyebrow{font-size:11px;letter-spacing:.22em;color:var(--cyan);margin-bottom:14px;}
.ms-h1{font-size:38px;font-weight:600;letter-spacing:-.01em;margin:0;
  background:linear-gradient(120deg,#fff 20%,var(--cyan) 60%,var(--violet));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.ms-lead{max-width:560px;margin:14px 0 0;font-size:15px;line-height:1.6;color:var(--ink-dim);}
/* celebration on logging a record (CPU-cheap: spawned spans, transform-only) */
.celeb-spark{position:fixed;width:var(--sz,7px);height:var(--sz,7px);border-radius:50%;pointer-events:none;z-index:9999;opacity:0;will-change:transform,opacity;animation-name:sparkOut;animation-fill-mode:forwards;animation-timing-function:cubic-bezier(.16,1,.3,1);}
.celeb-spark.sq{border-radius:1px;}
@keyframes sparkOut{0%{transform:rotate(var(--angle)) translateX(0) scale(.4);opacity:0}18%{transform:rotate(var(--angle)) translateX(14px) scale(1.15);opacity:1}70%{opacity:.9}100%{transform:rotate(var(--angle)) translateX(var(--dist)) scale(0) rotate(180deg);opacity:0}}
.celeb-ring{position:fixed;top:40%;left:50%;width:60px;height:60px;border-radius:50%;border:2px solid var(--cyan);margin:-30px 0 0 -30px;pointer-events:none;z-index:9999;will-change:transform,opacity;animation-name:celebRing;animation-fill-mode:forwards;animation-timing-function:cubic-bezier(.22,1,.36,1);opacity:0;}
@keyframes celebRing{0%{transform:scale(0);opacity:.9}100%{transform:scale(26);opacity:0}}
.celeb-word{position:fixed;top:40%;left:50%;font-family:var(--font-d);font-size:clamp(28px,5vw,54px);font-weight:700;letter-spacing:.02em;text-align:center;background:linear-gradient(120deg,var(--cyan),var(--violet),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent;pointer-events:none;z-index:9998;will-change:transform,opacity;animation:celebWord 1.45s cubic-bezier(.16,1,.3,1) forwards;white-space:nowrap;text-shadow:0 0 34px var(--glow-cyan);}
.celeb-word .sub{display:block;font-family:var(--font-m);font-size:.26em;font-weight:500;letter-spacing:.2em;color:var(--ink-faint);-webkit-text-fill-color:var(--ink-faint);background:none;margin-top:8px;}
@keyframes celebWord{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}32%{transform:translate(-50%,-50%) scale(1)}72%{opacity:1;transform:translate(-50%,-54%) scale(1)}100%{opacity:0;transform:translate(-50%,-66%) scale(.94)}}
@media (prefers-reduced-motion:reduce){.celeb-spark,.celeb-ring{display:none;}}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulseGlow{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes fadeUp{from{transform:translateY(10px)}to{transform:none}}
@keyframes popIn{from{transform:scale(.97)}to{transform:none}}
.fadeUp{animation:fadeUp .5s cubic-bezier(.2,.7,.2,1) both;}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;}
}
/* ── Lite mode — for laptops without a GPU ──
   Kills the three big GPU costs: large blur filters, backdrop-filter glass
   (recomputed on scroll), and continuous animation loops. */
.perf-lite *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;}
.perf-lite .nebula{display:none!important;}
.perf-lite #stars{opacity:.45;}
.perf-lite .glass{background:rgba(15,21,46,.95)!important;}
.perf-lite .node-orb{filter:none!important;}
.perf-lite .node-svg,.perf-lite .node-dot,.perf-lite .node-flow line,
.perf-lite .chat-tab-orb,.perf-lite .rec-empty-orb,.perf-lite .chat-orb,
.perf-lite .ro-status.na .ro-status-dot,.perf-lite .bubble.assistant::before,
.perf-lite .brand-mark,.perf-lite .pod-slot.p1{animation:none!important;}
/* trim the most expensive glows (soft, large-radius shadows) */
.perf-lite .dash-chart,.perf-lite .rep-fmt.on,.perf-lite .lb-chart,
.perf-lite .df-pop,.perf-lite .toast{box-shadow:none!important;}
</style>
</head>
<body>
<div id="bg">
  <div class="nebula neb1"></div>
  <div class="nebula neb2"></div>
  <div class="nebula neb3"></div>
</div>
<canvas id="stars"></canvas>
<div id="root"></div>

<!-- animated starfield (plain JS, runs immediately) -->
<script>
(function(){
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  let w,h,dpr,stars=[],shoot=null,raf;
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  function resize(){
    dpr = Math.min(devicePixelRatio||1, 2);
    w = c.width = innerWidth*dpr; h = c.height = innerHeight*dpr;
    c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px';
    const count = Math.round((innerWidth*innerHeight)/5200);
    stars = Array.from({length:count},()=>({
      x:Math.random()*w, y:Math.random()*h,
      r:(Math.random()*1.3+.2)*dpr,
      a:Math.random()*.6+.2,
      tw:Math.random()*.02+.004,
      ph:Math.random()*Math.PI*2,
      hue:Math.random()<.18?(Math.random()<.5?330:205):null,
      dx:(Math.random()-.5)*.02*dpr, dy:(Math.random()*.04+.01)*dpr,
    }));
  }
  function maybeShoot(){
    if(reduce) return;
    if(!shoot && Math.random()<.004){
      shoot={x:Math.random()*w*.7,y:Math.random()*h*.4,
        vx:(Math.random()*4+5)*dpr,vy:(Math.random()*2+1.6)*dpr,life:1};
    }
  }
  function frame(){
    ctx.clearRect(0,0,w,h);
    for(const s of stars){
      s.ph+=s.tw; const a=s.a*(0.6+0.4*Math.sin(s.ph));
      s.x+=s.dx; s.y+=s.dy;
      if(s.y>h)s.y=0; if(s.x>w)s.x=0; if(s.x<0)s.x=w;
      ctx.beginPath();
      if(s.hue){ctx.fillStyle=`oklch(.82 .14 ${s.hue} / ${a})`;}
      else ctx.fillStyle=`rgba(225,232,255,${a})`;
      ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();
    }
    maybeShoot();
    if(shoot){
      const g=ctx.createLinearGradient(shoot.x,shoot.y,shoot.x-shoot.vx*7,shoot.y-shoot.vy*7);
      g.addColorStop(0,`rgba(180,220,255,${shoot.life})`);g.addColorStop(1,'rgba(180,220,255,0)');
      ctx.strokeStyle=g;ctx.lineWidth=1.6*dpr;ctx.beginPath();
      ctx.moveTo(shoot.x,shoot.y);ctx.lineTo(shoot.x-shoot.vx*7,shoot.y-shoot.vy*7);ctx.stroke();
      shoot.x+=shoot.vx;shoot.y+=shoot.vy;shoot.life-=.012;
      if(shoot.life<=0||shoot.x>w||shoot.y>h)shoot=null;
    }
    raf=requestAnimationFrame(frame);
  }
  function drawStatic(){
    ctx.clearRect(0,0,w,h);
    for(const s of stars){ctx.beginPath();ctx.fillStyle=`rgba(225,232,255,${s.a})`;ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();}
  }
  let lite = reduce || document.documentElement.classList.contains('perf-lite');
  // Toggleable at runtime — stops the rAF loop entirely on lite (no per-frame repaint).
  window.starfieldSetLite=function(on){
    lite=on;
    if(on){ if(raf){cancelAnimationFrame(raf);raf=null;} drawStatic(); }
    else if(!raf){ frame(); }
  };
  addEventListener('resize',function(){resize(); if(lite) drawStatic();});resize();
  if(lite) drawStatic(); else frame();
})();
</script>

<!-- Firebase backend + Mission Control LLM bridge -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
(function(){
  const NS='concrete-breaks';
  try{ if(!firebase.apps.length) firebase.initializeApp({databaseURL:'https://gen-lang-client-0119642855-default-rtdb.firebaseio.com'}); }
  catch(e){ console.error('Firebase init failed',e); }
  const db=firebase.database();
  // Namespaced realtime helpers used by App.jsx for the shared (multi-user) backend.
  window.fb={
    listen:(p,cb)=>db.ref(NS+'/'+p).on('value',s=>cb(s.val())),
    set:(p,d)=>db.ref(NS+'/'+p).set(d),
    update:(p,d)=>db.ref(NS+'/'+p).update(d),
    remove:(p)=>db.ref(NS+'/'+p).remove(),
    get:(p)=>db.ref(NS+'/'+p).once('value').then(s=>s.val()),
    inc:(p,by)=>db.ref(NS+'/'+p).transaction(v=>(v||0)+by), // atomic point increments
    rootGet:(p)=>db.ref(p).once('value').then(s=>s.val()),
    rootSet:(p,d)=>db.ref(p).set(d)
  };
  // Mission Control LLM — MiniMax (Anthropic-compatible), key shared at ROOT config/minimax_key (same as CUP).
  const MM_URL='https://api.minimax.io/anthropic/v1/messages', MM_MODEL='MiniMax-M2.7';
  let mmKey=null;
  async function getKey(){
    if(mmKey)return mmKey;
    mmKey=await window.fb.rootGet('config/minimax_key').catch(()=>null);
    if(!mmKey)mmKey=localStorage.getItem('cup_alfred_key')||localStorage.getItem('cb_minimax_key');
    if(!mmKey){mmKey=prompt('Enter MiniMax API key (saved for all apps):');if(mmKey){localStorage.setItem('cb_minimax_key',mmKey);window.fb.rootSet('config/minimax_key',mmKey).catch(()=>{});}}
    return mmKey;
  }
  window.claude={complete:async(prompt)=>{
    const key=await getKey(); if(!key) throw new Error('no MiniMax key');
    const r=await fetch(MM_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model:MM_MODEL,max_tokens:1024,messages:[{role:'user',content:prompt}]})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    return (j.content&&j.content.map(c=>c.text||'').join(''))||j.reply||'';
  }};

  // Celebration burst on logging a record — confirms the log + dopamine hit.
  const CELEB=['oklch(.82 .15 200)','oklch(.74 .2 330)','oklch(.74 .17 285)','oklch(.8 .16 150)','oklch(.84 .15 75)'];
  window.celebrate=function(o){
    o=o||{}; const lite=document.documentElement.classList.contains('perf-lite');
    const count=lite?12:(o.count||26), rings=lite?0:(o.rings==null?2:o.rings);
    const cx=innerWidth/2, cy=innerHeight*0.4;
    for(let i=0;i<count;i++){
      const sp=document.createElement('span'); sp.className='celeb-spark'+(Math.random()<.35?' sq':'');
      const angle=(360/count)*i+(Math.random()-.5)*20, dist=70+Math.random()*120, size=5+Math.random()*8, color=CELEB[i%CELEB.length];
      sp.style.left=cx+'px'; sp.style.top=cy+'px'; sp.style.setProperty('--angle',angle+'deg');
      sp.style.setProperty('--dist',dist+'px'); sp.style.setProperty('--sz',size+'px');
      sp.style.background=color; sp.style.boxShadow='0 0 8px '+color;
      sp.style.animationDelay=(i*8)+'ms'; sp.style.animationDuration='850ms';
      document.body.appendChild(sp); sp.addEventListener('animationend',()=>sp.remove(),{once:true}); setTimeout(()=>sp.remove(),1300);
    }
    for(let i=0;i<rings;i++){ const r=document.createElement('div'); r.className='celeb-ring';
      r.style.borderColor=CELEB[i%CELEB.length]; r.style.animationDelay=(i*120)+'ms'; r.style.animationDuration='950ms';
      document.body.appendChild(r); r.addEventListener('animationend',()=>r.remove(),{once:true}); setTimeout(()=>r.remove(),1450); }
    if(o.word){ const w=document.createElement('div'); w.className='celeb-word';
      w.innerHTML=o.word+(o.sub?'<span class="sub">'+o.sub+'</span>':'');
      document.body.appendChild(w); w.addEventListener('animationend',()=>w.remove(),{once:true}); setTimeout(()=>w.remove(),1650); }
  };
})();
</script>
